[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prguard"
version = "0.3.0"
description = "GitHub Action that reviews pull requests for security issues and missing tests with an LLM, checked by Semgrep"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ishaq Ansary" }]
dependencies = [
    "anthropic>=2.6,<3",
    "httpx>=0.28,<1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
prguard = "prguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prguard"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]  # fake secrets and long fixture strings are the point

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
