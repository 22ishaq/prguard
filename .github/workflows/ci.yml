name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SEMGREP_VERSION: "1.184.0"

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # the real-semgrep tests skip themselves without it
      - run: pipx install "semgrep==${SEMGREP_VERSION}"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx install "semgrep==${SEMGREP_VERSION}"
      - run: semgrep scan --config p/python --config p/secrets --config p/github-actions --error --metrics=off src action.yml .github

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # audit what the action actually installs, not the dev tools
      - run: |
          python -m venv /tmp/audit
          # the runner's bundled pip is usually behind and would fail the audit on its own
          /tmp/audit/bin/pip install --quiet --upgrade pip
          /tmp/audit/bin/pip install --quiet . pip-audit
          /tmp/audit/bin/pip-audit --skip-editable

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
